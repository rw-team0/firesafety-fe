# firesafety-frontend 컨테이너 내부 nginx 설정.
# 이 파일은 로컬망 nginx(firesafety-be 레포의 deploy/nginx)와는 별개로,
# 프론트 컨테이너 안에서 정적 파일을 서빙하는 용도다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 모드 대응 — 존재하지 않는 경로는 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 서비스워커/매니페스트는 캐시되면 갱신이 늦어지므로 캐시하지 않는다
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
